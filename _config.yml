# Site settings
title: metriics # site title
lang: en-US # default lang
timezone: Asia/Vladivostok
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: metriics # author name
  bio: >- # tell to the world
    Python Developer and Data Scientist with a focus on machine learning (ML Engineering), control systems, and data engineering
    -> <a href="https://github.com/metriiics" target="_blank" rel="noopener">@github</a>.
  username: metriics # general username
  github: metriiics # github username
  email: metriics@yandex.ru # email adress
  avatar: /assets/img/avatar.jpg # change with your own avatar

# URL settings
url: "https://username.github.io" 
baseurl:
permalink: /:title/
google_analytics: # leave it blank if not wish
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles