<footer class="ai-footer">

  <div class="ai-footer-line"></div>

  <div class="ai-footer-content">

    <div class="ai-footer-text">

      <p class="ai-footer-description">
        Notes on AI, systems, and engineering.
      </p>

      <p class="ai-footer-copyright">
        {{ site.time | date: "%Y" }} — Alexsey Kochetkov
      </p>

    </div>

    <div class="ai-footer-links">

      <a
        href="https://github.com/metriiics"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="/assets/img/github.png"
          alt="GitHub"
          class="ai-footer-github-icon"
        >

        metriiics
      </a>

    </div>

  </div>

</footer>

<script src="/assets/js/main.js" defer="defer"></script>

{%- if site.google_analytics -%}
  <!-- Google tag (gtag.js) -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"
  ></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag("js", new Date());

    gtag("config", "{{ site.google_analytics }}");
  </script>
{%- endif -%}
